name: Deploy Production

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer:v2
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Node Dependencies
        run: npm ci

      - name: Build Assets
        run: npm run build

      - name: Install PHP Dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Prepare Environment
        run: |
          cp .env.example .env.testing
          php artisan key:generate --force --env=testing

      - name: Run Tests
        env:
          DB_CONNECTION: sqlite
          DB_DATABASE: ':memory:'
        run: ./vendor/bin/pest

  deploy:
    needs: tests
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script: |
            set -e
            cd ${{ secrets.DEPLOY_PATH }}

            git pull origin main

            # Build ulang image (asset frontend di-build di dalam Docker build)
            docker compose -f docker-compose.prod.yaml build

            docker compose -f docker-compose.prod.yaml up -d --wait || \
              docker compose -f docker-compose.prod.yaml up -d

            # Migrasi idempoten (tabel migrations mencegah duplikasi).
            # Catatan: saat deploy PERTAMA kali, biarkan installer web yang migrasi;
            # baris ini aman tetap dijalankan.
            docker compose -f docker-compose.prod.yaml exec -T php php artisan migrate --force --no-interaction

            docker compose -f docker-compose.prod.yaml exec -T php php artisan optimize || true
