# nixpacks.toml - Nixpacks config for Laravel

[phases.setup]
nixPkgs = ["nodejs_20"]

[phases.install]
cmds = [
    "COMPOSER_ALLOW_SUPERUSER=1 composer install --no-dev --optimize-autoloader --no-interaction --ignore-platform-reqs",
    "npm ci"
]

[phases.build]
cmds = [
    "npm run build"
]

[env]
COMPOSER_ALLOW_SUPERUSER = "1"
NODE_VERSION = "20"
